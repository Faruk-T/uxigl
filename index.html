<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uxiGL — Liquid Glass × Material 3 Tasarım Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts: Inter, Plus Jakarta Sans, Outfit (Material You), DM Sans, Space Grotesk, JetBrains Mono & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols Variable Font Icons (Rounded, Outlined & Sharp with opsz, wght, FILL, GRAD axes) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('uxu.theme.preferences') ||
            localStorage.getItem('uxu.design_system.theme_preferences.v3') ||
            localStorage.getItem('uxu.design_system.theme_preferences.v2');
          if (raw) {
            var p = JSON.parse(raw);
            var mode =
              p.mode === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : p.mode || 'dark';
            document.documentElement.setAttribute('data-theme', mode);
            document.documentElement.style.colorScheme = mode;
            if (p.seedPalette) {
              document.documentElement.setAttribute('data-seed', p.seedPalette);
            }
            if (p.webglEnabled !== undefined) {
              document.documentElement.setAttribute(
                'data-webgl',
                String(Boolean(p.webglEnabled))
              );
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
